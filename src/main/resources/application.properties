spring.application.name=accesoriosMoto

spring.datasource.url=jdbc:h2:file:./data/accesoriosMoto;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Si no existe la variable de entorno JWT_SECRET, usa la clave por defecto tras los dos puntos ':'
security.jwt.secret=${JWT_SECRET:accesoriosMoto-clave-secreta-para-clase-de-seguridad-2026}
security.jwt.expiration=30m
security.jwt.issuer=accesoriosMoto
security.admin-inicial.enabled=${ADMIN_INICIAL_ENABLED:false}
security.admin-inicial.nombre=${ADMIN_INICIAL_NOMBRE:}
security.admin-inicial.correo=${ADMIN_INICIAL_CORREO:}
security.admin-inicial.contrasena=${ADMIN_INICIAL_CONTRASENA:}

# Carga automática de datos de prueba al arrancar
app.datos-prueba.enabled=${DATOS_PRUEBA_ENABLED:true}

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8



